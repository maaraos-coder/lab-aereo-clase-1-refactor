<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07172b"/><stop offset="1" stop-color="#0b4775"/></linearGradient><linearGradient id="slab" x2="1"><stop stop-color="#d9e6ef"/><stop offset=".5" stop-color="#849bb0"/><stop offset="1" stop-color="#eff6fa"/></linearGradient></defs>
<rect width="1400" height="620" rx="28" fill="url(#bg)"/>
<text x="70" y="72" fill="#65dcf3" font-family="Arial" font-size="26" font-weight="700">1 · PLACA SIMPLE Y MASA SUPERFICIAL</text>
<text x="70" y="116" fill="#fff" font-family="Arial" font-size="20">Una sola hoja dinámica: sus capas solidarias vibran como un único elemento.</text>
<g transform="translate(105 175)">
 <path d="M85 40 L410 40 L505 95 L180 95 Z" fill="#e9f2f7" stroke="#65dcf3" stroke-width="3"/>
 <path d="M180 95 L505 95 L505 335 L180 335 Z" fill="url(#slab)" stroke="#65dcf3" stroke-width="3"/>
 <path d="M85 40 L180 95 L180 335 L85 280 Z" fill="#6d8599" stroke="#65dcf3" stroke-width="3"/>
 <line x1="85" y1="365" x2="180" y2="365" stroke="#ffb55c" stroke-width="4"/>
 <path d="M85 365 l18 -10 v20z M180 365 l-18 -10 v20z" fill="#ffb55c"/>
 <text x="116" y="405" fill="#fff" font-family="Arial" font-size="24">h</text>
 <text x="236" y="215" fill="#07172b" font-family="Arial" font-size="25" font-weight="700">ρ · densidad</text>
 <text x="235" y="250" fill="#173f63" font-family="Arial" font-size="20">kg/m³</text>
</g>
<g transform="translate(735 190)">
 <rect width="555" height="270" rx="22" fill="#fff" fill-opacity=".08" stroke="#65dcf3" stroke-width="2"/>
 <text x="35" y="58" fill="#fff" font-family="Arial" font-size="25">Masa contenida en cada metro cuadrado</text>
 <text x="80" y="140" fill="#65dcf3" font-family="Arial" font-size="48" font-weight="700">m′ = ρ · h</text>
 <text x="35" y="205" fill="#fff" font-family="Arial" font-size="22">m′ [kg/m²] controla la oposición inercial.</text>
 <text x="35" y="240" fill="#ffca78" font-family="Arial" font-size="19">No es la masa total de toda la placa.</text>
</g>
<text x="735" y="515" fill="#d8e8f4" font-family="Arial" font-size="20">Mayor ρ o mayor h  →  mayor m′  →  mayor oposición al movimiento</text>
</svg>
