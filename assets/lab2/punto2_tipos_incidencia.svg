 <g transform="translate(55 135)"><rect width="390" height="400" rx="22" fill="#fff" fill-opacity=".07"/><text x="28" y="45" fill="#fff" font-size="23" font-weight="700">Normal · θ = 0°</text><rect x="270" y="90" width="20" height="230" fill="#a9bdcc"/><line x1="55" y1="205" x2="260" y2="205" stroke="#65dcf3" stroke-width="7" marker-end="url(#arr)"/><line x1="170" y1="205" x2="350" y2="205" stroke="#fff" stroke-width="2" stroke-dasharray="8 8"/><text x="50" y="360" fill="#d8e8f4" font-size="18">Llegada perpendicular</text></g>
