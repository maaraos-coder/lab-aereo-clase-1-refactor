<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
<defs><linearGradient id="bg4" x2="1" y2="1"><stop stop-color="#07172b"/><stop offset="1" stop-color="#0b4775"/></linearGradient><marker id="a4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#65dcf3"/></marker></defs>
<rect width="1400" height="620" rx="28" fill="url(#bg4)"/>
<text x="70" y="72" fill="#65dcf3" font-family="Arial" font-size="26" font-weight="700">4 · INCIDENCIA ALEATORIA Y DE CAMPO</text>
<g transform="translate(75 145)">
 <rect x="430" y="20" width="24" height="330" fill="#a9bdcc"/>
 <line x1="70" y1="60" x2="420" y2="165" stroke="#65dcf3" stroke-width="6" marker-end="url(#a4)"/>
 <line x1="45" y1="180" x2="420" y2="180" stroke="#65dcf3" stroke-width="6" marker-end="url(#a4)"/>
 <line x1="70" y1="310" x2="420" y2="195" stroke="#65dcf3" stroke-width="6" marker-end="url(#a4)"/>
 <path d="M255 180 A165 165 0 0 1 290 78" fill="none" stroke="#ffb55c" stroke-width="4"/>
 <text x="260" y="68" fill="#ffca78" font-family="Arial" font-size="22">θlim = 78°</text>
 <text x="70" y="400" fill="#fff" font-family="Arial" font-size="20">Muchas direcciones aportan energía</text>
</g>
<g transform="translate(650 145)" font-family="Arial">
 <rect width="670" height="335" rx="22" fill="#fff" fill-opacity=".08" stroke="#65dcf3" stroke-width="2"/>
 <text x="32" y="58" fill="#fff" font-size="22">1 · Calcular τ(θ) para cada dirección</text>
 <text x="32" y="108" fill="#fff" font-size="22">2 · Ponderar con sinθ · cosθ</text>
 <text x="32" y="158" fill="#fff" font-size="22">3 · Promediar energía → τ̄</text>
 <text x="32" y="222" fill="#65dcf3" font-size="31" font-weight="700">TLcampo = −10 log₁₀(τ̄)</text>
 <rect x="32" y="260" width="604" height="48" rx="12" fill="#ffb55c" fill-opacity=".18"/>
 <text x="52" y="292" fill="#ffca78" font-size="20" font-weight="700">No se promedian directamente los TL en dB.</text>
</g>
<text x="70" y="570" fill="#d8e8f4" font-family="Arial" font-size="20">78° es el límite de integración del modelo de campo; no representa una única onda incidente.</text>
</svg>
