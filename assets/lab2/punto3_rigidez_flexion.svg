 <text x="325" y="70" fill="#ffca78" font-family="Arial" font-size="24">Δp</text>
 <text x="185" y="365" fill="#fff" font-family="Arial" font-size="22">deformación ξ(x,y)</text>
</g>
<g transform="translate(750 170)" font-family="Arial">
 <rect width="550" height="270" rx="22" fill="#fff" fill-opacity=".08" stroke="#65dcf3" stroke-width="2"/>
 <text x="52" y="88" fill="#65dcf3" font-size="39" font-weight="700">D = E h³ / 12(1−ν²)</text>
 <text x="38" y="150" fill="#fff" font-size="21">E: módulo de Young  ·  ν: Poisson</text>
 <text x="38" y="198" fill="#fff" font-size="21">h: espesor de la placa</text>
 <text x="38" y="242" fill="#ffca78" font-size="22" font-weight="700">Duplicar h → D aumenta ≈ 8 veces</text>
