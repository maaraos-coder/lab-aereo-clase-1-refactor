<text x="70" y="72" fill="#65dcf3" font-family="Arial" font-size="26" font-weight="700">3 · RIGIDEZ DE FLEXIÓN</text>
<text x="70" y="112" fill="#fff" font-family="Arial" font-size="20">La placa no solo se traslada: también se curva bajo la diferencia de presión.</text>
<g transform="translate(70 165)">
 <line x1="35" y1="35" x2="35" y2="325" stroke="#a9bdcc" stroke-width="18"/><line x1="575" y1="35" x2="575" y2="325" stroke="#a9bdcc" stroke-width="18"/>
 <path d="M45 180 C180 80 440 280 565 180" fill="none" stroke="#65dcf3" stroke-width="16"/>
