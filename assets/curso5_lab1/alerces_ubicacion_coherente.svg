304</text><rect x="66" y="1023" width="628" height="34" rx="0" fill="#e2e9ef" stroke="#8eaabd"/><text x="276" y="1046" font-size="16" font-weight="400" fill="#55758a">PASILLO COMÚN</text><path d="M735,984 L735,936" fill="none" stroke="#087fa8" stroke-width="3" stroke-dasharray=""/><polygon points="735.0,927.0 729.0,941.0 741.0,941.0" fill="#087fa8" stroke="#087fa8" stroke-width="1.5"/><text x="727" y="921" font-size="17" font-weight="700" fill="#087fa8">N</text><text x="828" y="875" font-size="20" font-weight="700" fill="#153c54">04 / RELACIONES QUE CALCULARÁS</text><text x="828" y="918" font-size="18" font-weight="700" fill="#075f81">AI-01 · A-301 → A-302</text><text x="828" y="941" font-size="16" font-weight="400" fill="#55758a">Separación horizontal · muro M-01 y flancos</text><text x="828" y="963" font-size="18" font-weight="700" fill="#075f81">IM-01 · A-402 → A-302</text><text x="828" y="986" font-size="16" font-weight="400" fill="#55758a">Separación vertical · losa L-01</text><text x="828" y="1008" font-size="18" font-weight="700" fill="#075f81">FA-01 · exterior norte → estar A-302</text><text x="828" y="1031" font-size="16" font-weight="400" fill="#55758a">Paño opaco F-01 + ventana V-01</text><text x="828" y="1053" font-size="18" font-weight="700" fill="#075f81">IN-01 · shaft S-1 → dormitorio principal</text><text x="828" y="1076" font-size="16" font-weight="400" fill="#55758a">Cierre del shaft, fijaciones y transmisiones</text></g></svg>