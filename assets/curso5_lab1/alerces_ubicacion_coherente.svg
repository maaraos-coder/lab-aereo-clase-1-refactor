<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc"><title id="title">Los Alerces: ubicación y axonometría coherente de A-302</title><desc id="desc">Cinco pisos, cuatro viviendas por piso. A-302 es la segunda unidad desde el oeste del tercer piso. La axonometría sigue la planta AC-01: estar y dormitorio principal al norte, dormitorio 2 y cocina al sur, baño y shaft al este. A-301 al oeste, A-402 encima.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eef7fc"/><stop offset="1" stop-color="#ffffff"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#078bb1"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="1600" height="1120" rx="24" fill="#f2f7fb" stroke="none"/><rect x="24" y="24" width="1552" height="114" rx="18" fill="#103d58" stroke="none"/><text x="48" y="62" font-size="20" font-weight="700" fill="#8ee6f5">LOS ALERCES · UNA SOLA GEOMETRÍA DE REFERENCIA</text><text x="48" y="103" font-size="32" font-weight="700" fill="white">A-302: ubicación en el edificio y lectura espacial</text><rect x="24" y="158" width="510" height="656" rx="18" fill="white" stroke="#d1e1eb"/><rect x="554" y="158" width="1022" height="656" rx="18" fill="url(#bg)" stroke="#d1e1eb"/><text x="48" y="198" font-size="22" font-weight="700" fill="#153c54">01 / UBICACIÓN DE LA UNIDAD</text><text x="48" y="228" font-size="18" font-weight="400" fill="#55758a">5 pisos × 4 viviendas = 20 viviendas</text><polygon points="446.0,300.0 491.0,274.0 491.0,654.0 446.0,680.0" fill="#c8d9e4" stroke="#7493a6" stroke-width="1.5"/><polygon points="70.0,300.0 115.0,274.0 491.0,274.0 446.0,300.0" fill="#e6eff5" stroke="#7493a6" stroke-width="1.5"/><rect x="70" y="300" width="94" height="76" rx="0" fill="#f3f6f8" stroke="#bdcfdc"/><rect x="82" y="310" width="70" height="36" rx="3" fill="#9db7c8" stroke="none"/><path d="M82,354 L