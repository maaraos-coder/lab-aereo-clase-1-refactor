<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc"><title id="title">Ubicación de A-302 y viviendas colindantes</title><desc id="desc">Planta esquemática con cuatro viviendas por piso: A-301 al oeste, A-302, A-303 al este y A-304. A-402 está encima de A-302 y A-202 debajo. Pasillo común al sur. Esquema sin escala, las distribuciones interiores están en AC-01.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#118bb2"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="1200" height="830" fill="#f3f8fc" stroke="#bbd1df" rx="22"/><text x="34" y="48" font-size="27" fill="#153e56" font-weight="700" text-anchor="start">UBICACIÓN DE A-302 Y SUS COLINDANCIAS</text><text x="34" y="80" font-size="20" fill="#527388" font-weight="400" text-anchor="start">Planta de ubicación · tercer piso · cuatro viviendas por nivel</text><rect x="24" y="105" width="1152" height="330" fill="white" stroke="#bbd1df" rx="16"/><text x="48" y="142" font-size="19" fill="#087fa5" font-weight="700" text-anchor="start">NORTE · fachada exterior</text><path d="M1110 168L1110 122" stroke="#118bb2" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="1100" y="117" font-size="19" fill="#087fa5" font-weight="700" text-anchor="start">N</text><rect x="50" y="185" width="270" height="147" fill="#edf2f6" stroke="#a9c0d0" rx="0"/><text x="185" y="237" font-size="31" fill="#3c5d73" font-weight="700" text-anchor="middle">A-301</text><text x="185" y="268" font-size="17" fill="#527388" font-weight="400" text-anchor="middle">Vecina al oeste</text><path d="M230 332L266 332" stroke="white" stroke-width="8" fill="none"/><path d="M230 332L230 300" stroke="#55788d" stroke-width="2" fill="none"/><path d="M230 300Q266 300 266 332" stroke="#90aaba" fill="none"/><rect x="320" y="185" width="270" height="147" fill="#d9f3fd" stroke="#0789b0" rx="0"/><text x="455" y="237" font-size="31" fill="#087b9c" font-weight="700" text-anchor="middle">A-302</text><text x="455" y="268" font-size="17" fill="#527388" font-weight="400" text-anchor="middle">Unidad de estudio</text><path d="M500 332L536 332" stroke="white" stroke-width="8" fill="none"/><path d="M500 332L500 300" stroke="#55788d" stroke-width="2" fill="none"/><path d="M500 300Q536 300 536 332" stroke="#90aaba" fill="none"/><rect x="590" y="185" width="270" height="147" fill="#edf2f6" stroke="#a9c0d0" rx="0"/><text x="725" y="237" font-size="31" fill="#3c5d73" font-weight="700" text-anchor="middle">A-303</text><text x="725" y="268" font-size="17" fill="#527388" font-weight="400" text-anchor="middle">Vecina al este</text><path d="M770 332L806 332" stroke="white" stroke-width="8" fill="none"/><path d="M770 332L770 300" stroke="#55788d" stroke-width="2" fill="none"/><path d="M770 300Q806 300 806 332" stroke="#90aaba" fill="none"/><rect x="860" y="185" width="270" height="147" fill="#edf2f6" stroke="#a9c0d0" rx="0"/><text x="995" y="237" font-size="31" fill="#3c5d73" font-weight="700" text-anchor="middle">A-304</text><text x="995" y="268" font-size="17" fill="#527388" font-weight="400" text-anchor="middle">Otra vivienda del piso</text><path d="M1040 332L1076 332" stroke="white" stroke-width="8" fill="none"/><path d="M1040 332L1040 300" stroke="#55788d" stroke-width="2" fill="none"/><path d="M1040 300Q1076 300 1076 332" stroke="#90aaba" fill="none"/><rect x="50" y="332" width="1080" height="65" fill="#e0e8ef" stroke="#bbd1df" rx="0"/><text x="590" y="373" font-size="20" fill="#46697e" font-weight="400" text-anchor="middle">PASILLO COMÚN · acceso a las cuatro viviendas</text><path d="M320 185L320 332" stroke="#da7050" stroke-width="5" fill="none"/><text x="320" y="313" font-size="17" fill="#a84d2e" font-weight="700" text-anchor="middle">M-01</text><path d="M230 285L386 285" stroke="#118bb2" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="50" y="420" font-size="18" fill="#087b9c" font-weight="700" text-anchor="start">AI-01: estar A-301 → estar A-302 · separador oeste y flancos</text><rect x="24" y="454" width="1152" height="290" fill="white" stroke="#bbd1df" rx="16"/><text x="48" y="493" font-size="22" fill="#153e56" font-weight="700" text-anchor="start">RELACIÓN VERTICAL · misma posición en pisos sucesivos</text><rect x="70" y="514" width="400" height="61" fill="#edf2f6" stroke="#adc4d4" rx="8"/><text x="90" y="553" font-size="25" fill="#075e80" font-weight="700" text-anchor="start">A-402</text><text x="205" y="551" font-size="17" fill="#527388" font-weight="400" text-anchor="start">4.º piso · emisor de impacto</text><rect x="70" y="580" width="400" height="61" fill="#d9f3fd" stroke="#0789b0" rx="8"/><text x="90" y="619" font-size="25" fill="#075e80" font-weight="700" text-anchor="start">A-302</text><text x="205" y="617" font-size="17" fill="#527388" font-weight="400" text-anchor="start">3.er piso · receptor</text><rect x="70" y="646" width="400" height="61" fill="#edf2f6" stroke="#adc4d4" rx="8"/><text x="90" y="685" font-size="25" fill="#075e80" font-weight="700" text-anchor="start">A-202</text><text x="205" y="683" font-size="17" fill="#527388" font-weight="400" text-anchor="start">2.º piso · vivienda inferior</text><path d="M510 543L510 608" stroke="#118bb2" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="555" y="554" font-size="23" fill="#087b9c" font-weight="700" text-anchor="start">IM-01: A-402 → A-302</text><text x="555" y="587" font-size="18" fill="#527388" font-weight="400" text-anchor="start">Losa L-01 · transmisión de impacto y flancos</text><text x="555" y="645" font-size="18" fill="#527388" font-weight="400" text-anchor="start">A-303 y A-202 se muestran como contexto.</text><text x="555" y="673" font-size="18" fill="#527388" font-weight="400" text-anchor="start">No añaden cálculos a los cuatro casos obligatorios.</text><text x="34" y="781" font-size="18" fill="#607e91" font-weight="400" text-anchor="start">Esquema de ubicación sin escala: no representa la distribución interior de las viviendas vecinas.</text><text x="34" y="808" font-size="18" fill="#607e91" font-weight="400" text-anchor="start">Para acceso, puertas y geometría de A-302, utiliza la planta técnica AC-01 revisada.</text></g></svg>